[cicala]
version = 0.1.0

[env:cicala]
extends = env:x4pro
custom_cicala_board = x4pro
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DUSB_PRODUCT=\"Cicala_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCICALA_ENABLED=1
  -DOTA_REPOSITORY=\"giacomomellone/cicala-crosspoint\"
  -DOTA_VERSION=\"${cicala.version}\"
  -DOTA_ASSET_PREFIX=\"cicala-crosspoint\"
  -DOTA_ASSET_SUFFIX=\"-x4pro\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DCICALA_FIRMWARE_VERSION=\"${cicala.version}\"
  -DCICALA_UPSTREAM_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
extra_scripts =
  pre:scripts/cicala/prepare.py
  ${base.extra_scripts}

[env:cicala_release]
extends = env:cicala
build_unflags =
  ${base.build_unflags}
  -DLOG_LEVEL=2
build_flags =
  ${env:cicala.build_flags}
  -DLOG_LEVEL=1
